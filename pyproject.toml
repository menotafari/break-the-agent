[project]
name = "break-the-agent"
version = "0.1.0"
description = "A public AI red-team lab: break AI agents, then ship the exploits and the fixes."
requires-python = ">=3.11"
dependencies = ["ollama>=0.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bta = "bta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
